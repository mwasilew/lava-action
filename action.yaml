name: 'Submit LAVA job'
description: 'Submit LAVA test job'
inputs:
  job_definition:
    description: 'Test job definition to submit'
    required: true
  lava_token:
    description: 'Authentication token for job submission'
    required: true
  lava_url:
    description: 'URL of LAVA instance'
    required: true
  wait_for_job:
    description: 'Wait for job completion and stream logs'
    default: false
  fail_action_on_failure:
    description: 'Marks action failed in any test result is "fail". Requires wait_for_job set to "true"'
    default: true
  fail_action_on_incomplete:
    description: 'Marks action failed in case test jobs ends as Incomplete or is Canceled'
    default: true
  save_result_as_artifact:
    description: 'Save test results as JUNIT XML file'
    default: false
  save_job_details:
    description: 'Save job details as JSON file'
    default: false
  result_file_name:
    description: 'File name in which the test results will be stored. Defaults to test-results-<jobID>.
      If the file with the same name is already stored as workflow artifact it will be overwritten.
      This option is useful for keeping clean results in case of re-running test jobs.'
  test_job_file_name_prefix:
    description: 'Prefix for the job details filename. It will prepend the test-job-<job ID>.json'
  fake_lava_submission:
    description: 'Do not submit anything to LAVA. Instead produce a results file (and
      optionally job details) compatible with a real LAVA submission. Useful for testing
      the workflow that consumes this action without a working LAVA instance.'
    default: false
  fake_results:
    description: 'Inline YAML (or JSON) describing what the fake submission should return.
      Only used when fake_lava_submission is "true". Supported keys: job_id, job_index,
      state, health, error, submitter, description and suites (list of
      {name, cases: [{name, result, message}]} where result is pass, fail, skip or unknown).
      Omit to get two passing cases in suite "0_fake-suite". The same spec always produces
      the same results. The fake job ID is packed from GITHUB_RUN_NUMBER, GITHUB_RUN_ATTEMPT
      and job_index, so it is unique by construction rather than by chance. In a matrix set
      job_index to the strategy.job-index context value, and to a distinct value per step if
      the action is used more than once in one job. See the README for the exact syntax; it
      cannot be spelled out here, because expressions in an action file are evaluated when
      the action is loaded and the strategy context does not exist at that point.'

runs:
  using: 'node24'
  main: 'submit.js'
